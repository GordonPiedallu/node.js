openapi: 3.0.0

info:
  title: API de borne de restauration rapide
  description: API REST pour gérer les utilisateurs, produits, menus et commandes d'une borne de restauration rapide.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Serveur local de développement

tags:
  - name: Auth
    description: Authentification des utilisateurs

  - name: Users
    description: Gestion des utilisateurs

  - name: Products
    description: Gestion des produits

  - name: Menus
    description: Gestion des menus

  - name: Orders
    description: Gestion des commandes


paths:

  # =========================================================
  # AUTHENTIFICATION
  # =========================================================

  /register:
    post:
      tags:
        - Auth

      summary: Inscription d'un utilisateur

      description: Crée un nouveau compte utilisateur et retourne un token JWT.

      security: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'

            example:
              name: Jean Dupont
              email: jean@example.com
              password: password123

      responses:
        '201':
          description: Utilisateur créé avec succès

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

        '400':
          description: Données invalides

        '409':
          description: Utilisateur déjà existant

        '500':
          description: Erreur serveur


  /login:
    post:
      tags:
        - Auth

      summary: Connexion d'un utilisateur

      description: Authentifie un utilisateur et retourne un token JWT.

      security: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

            example:
              email: jean@example.com
              password: password123

      responses:
        '200':
          description: Connexion réussie

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

        '401':
          description: Email ou mot de passe incorrect

        '500':
          description: Erreur serveur


  # =========================================================
  # USERS
  # =========================================================

  /users:
    get:
      tags:
        - Users

      summary: Récupérer tous les utilisateurs

      description: Cette route est réservée aux administrateurs.

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Liste des utilisateurs

          content:
            application/json:
              schema:
                type: array

                items:
                  $ref: '#/components/schemas/User'

        '401':
          description: Token manquant, invalide ou expiré

        '403':
          description: Accès réservé aux administrateurs

        '500':
          description: Erreur serveur


  # =========================================================
  # PRODUCTS
  # =========================================================

  /products:

    get:
      tags:
        - Products

      summary: Récupérer tous les produits

      security: []

      responses:
        '200':
          description: Liste des produits

          content:
            application/json:
              schema:
                type: object

                properties:
                  products:
                    type: array

                    items:
                      $ref: '#/components/schemas/Product'

                  message:
                    type: string
                    example: Liste des produits complète

        '500':
          description: Erreur serveur


    post:
      tags:
        - Products

      summary: Créer un produit

      description: Ajoute un nouveau produit.

      security: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'

            example:
              title: Burger Classic
              description: Burger avec steak, salade et sauce
              image: burger-classic.jpg
              price: 8.90

      responses:
        '201':
          description: Produit créé avec succès

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '500':
          description: Erreur serveur


  /products/{id}:

    get:
      tags:
        - Products

      summary: Récupérer un produit

      security: []

      parameters:
        - $ref: '#/components/parameters/Id'

      responses:
        '200':
          description: Produit trouvé

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '404':
          description: Produit non trouvé

        '500':
          description: Erreur serveur


    put:
      tags:
        - Products

      summary: Modifier un produit

      security: []

      parameters:
        - $ref: '#/components/parameters/Id'

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'

      responses:
        '200':
          description: Produit modifié avec succès

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '404':
          description: Produit non trouvé

        '500':
          description: Erreur serveur


    delete:
      tags:
        - Products

      summary: Supprimer un produit

      security: []

      parameters:
        - $ref: '#/components/parameters/Id'

      responses:
        '200':
          description: Produit supprimé avec succès

        '404':
          description: Produit non trouvé

        '500':
          description: Erreur serveur


  # =========================================================
  # MENUS
  # =========================================================

  /menus:

    get:
      tags:
        - Menus

      summary: Récupérer tous les menus

      security: []

      responses:
        '200':
          description: Liste des menus

          content:
            application/json:
              schema:
                type: array

                items:
                  $ref: '#/components/schemas/Menu'

        '500':
          description: Erreur serveur


    post:
      tags:
        - Menus

      summary: Créer un menu

      security: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuInput'

            example:
              name: Menu Classic
              description: Burger, frites et boisson
              image: menu-classic.jpg
              size: Medium
              price: 12.90

      responses:
        '201':
          description: Menu créé avec succès

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'

        '500':
          description: Erreur serveur


  /menus/{id}:

    get:
      tags:
        - Menus

      summary: Récupérer un menu

      security: []

      parameters:
        - $ref: '#/components/parameters/Id'

      responses:
        '200':
          description: Menu trouvé

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'

        '404':
          description: Menu non trouvé

        '500':
          description: Erreur serveur


    put:
      tags:
        - Menus

      summary: Modifier un menu

      security: []

      parameters:
        - $ref: '#/components/parameters/Id'

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuInput'

      responses:
        '200':
          description: Menu modifié avec succès

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'

        '404':
          description: Menu non trouvé

        '500':
          description: Erreur serveur


    delete:
      tags:
        - Menus

      summary: Supprimer un menu

      security: []

      parameters:
        - $ref: '#/components/parameters/Id'

      responses:
        '200':
          description: Menu supprimé avec succès

        '404':
          description: Menu non trouvé

        '500':
          description: Erreur serveur


  # =========================================================
  # COMMANDES
  # =========================================================

  /orders:

    post:
      tags:
        - Orders

      summary: Créer une commande

      description: |
        Cette route est réservée aux utilisateurs ayant le rôle client.

        Le token JWT est obligatoire.

      security:
        - bearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'

            example:
              productId: 665c8f123456789012345678
              quantity: 2
              totalPrice: 17.80

      responses:
        '201':
          description: Commande créée avec succès

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

        '401':
          description: Token manquant, invalide ou expiré

        '403':
          description: Seuls les clients peuvent créer une commande

        '500':
          description: Erreur serveur


    get:
      tags:
        - Orders

      summary: Récupérer toutes les commandes

      description: |
        Accessible aux utilisateurs ayant le rôle admin ou préparateur.

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Liste des commandes

          content:
            application/json:
              schema:
                type: array

                items:
                  $ref: '#/components/schemas/Order'

        '401':
          description: Token manquant, invalide ou expiré

        '403':
          description: Accès réservé aux administrateurs et préparateurs

        '500':
          description: Erreur serveur


  /orders/{id}:

    get:
      tags:
        - Orders

      summary: Récupérer une commande

      description: |
        Accessible aux utilisateurs ayant le rôle admin ou préparateur.

      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/Id'

      responses:
        '200':
          description: Commande trouvée

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

        '401':
          description: Token manquant, invalide ou expiré

        '403':
          description: Accès réservé aux administrateurs et préparateurs

        '404':
          description: Commande non trouvée

        '500':
          description: Erreur serveur


    put:
      tags:
        - Orders

      summary: Modifier une commande

      description: |
        Cette route est réservée aux préparateurs.

        Le préparateur peut modifier le produit, la quantité,
        le prix total et le statut de la commande.

      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/Id'

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdateInput'

            example:
              productId: 665c8f123456789012345678
              quantity: 2
              totalPrice: 17.80
              status: en_preparation

      responses:
        '200':
          description: Commande modifiée avec succès

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

        '401':
          description: Token manquant, invalide ou expiré

        '403':
          description: Accès réservé aux préparateurs

        '404':
          description: Commande non trouvée

        '500':
          description: Erreur serveur


    delete:
      tags:
        - Orders

      summary: Supprimer une commande

      description: |
        Cette route est réservée aux administrateurs.

      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/Id'

      responses:
        '200':
          description: Commande supprimée avec succès

          content:
            application/json:
              schema:
                type: object

                properties:
                  message:
                    type: string
                    example: Commande supprimée avec succès

        '401':
          description: Token manquant, invalide ou expiré

        '403':
          description: Accès réservé aux administrateurs

        '404':
          description: Commande non trouvée

        '500':
          description: Erreur serveur


components:


  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Entrez votre token JWT.



  parameters:

    Id:
      name: id
      in: path
      required: true

      description: Identifiant MongoDB de la ressource

      schema:
        type: string

        example: 665c8f123456789012345678



  schemas:

    RegisterRequest:

      type: object

      required:
        - name
        - email
        - password

      properties:

        name:
          type: string
          example: Jean Dupont

        email:
          type: string
          format: email
          example: jean@example.com

        password:
          type: string
          format: password
          example: password123



    LoginRequest:

      type: object

      required:
        - email
        - password

      properties:

        email:
          type: string
          format: email
          example: jean@example.com

        password:
          type: string
          format: password
          example: password123



    AuthResponse:

      type: object

      properties:

        message:
          type: string
          example: Connexion réussie

        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

        user:
          $ref: '#/components/schemas/User'



    User:

      type: object

      properties:

        _id:
          type: string
          example: 665c8f123456789012345678

        name:
          type: string
          example: Jean Dupont

        email:
          type: string
          format: email
          example: jean@example.com

        role:
          type: string

          enum:
            - client
            - préparateur
            - admin

          example: client

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time



    Product:

      type: object

      properties:

        _id:
          type: string
          example: 665c8f123456789012345678

        title:
          type: string
          example: Burger Classic

        description:
          type: string
          example: Burger avec steak, salade et sauce

        image:
          type: string
          example: burger-classic.jpg

        price:
          type: number
          format: float
          example: 8.90

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time



    ProductInput:

      type: object

      required:
        - title
        - description
        - image
        - price

      properties:

        title:
          type: string
          example: Burger Classic

        description:
          type: string
          example: Burger avec steak, salade et sauce

        image:
          type: string
          example: burger-classic.jpg

        price:
          type: number
          format: float
          example: 8.90



    Menu:

      type: object

      properties:

        _id:
          type: string
          example: 665c8f123456789012345678

        name:
          type: string
          example: Menu Classic

        description:
          type: string
          example: Burger, frites et boisson

        image:
          type: string
          example: menu-classic.jpg

        size:
          type: string
          example: Medium

        price:
          type: number
          format: float
          example: 12.90

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time


    MenuInput:

      type: object

      required:
        - name
        - description
        - image
        - size
        - price

      properties:

        name:
          type: string
          example: Menu Classic

        description:
          type: string
          example: Burger, frites et boisson

        image:
          type: string
          example: menu-classic.jpg

        size:
          type: string
          example: Medium

        price:
          type: number
          format: float
          example: 12.90



    Order:

      type: object

      properties:

        _id:
          type: string
          example: 665c8f123456789012345678

        user:
          type: string
          example: 665c8f123456789012345678

        product:
          type: object

          properties:

            _id:
              type: string
              example: 665c8f123456789012345678

            title:
              type: string
              example: Burger Classic

            description:
              type: string
              example: Burger avec steak, salade et sauce

            image:
              type: string
              example: burger-classic.jpg

            price:
              type: number
              format: float
              example: 8.90

        quantity:
          type: integer
          minimum: 1
          example: 2

        totalPrice:
          type: number
          format: float
          example: 17.80

        status:
          type: string

          enum:
            - en_attente
            - en_preparation
            - prete
            - terminee
            - annulee

          example: en_attente

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time



    OrderInput:

      type: object

      required:
        - productId
        - quantity
        - totalPrice

      properties:

        productId:
          type: string

          description: Identifiant du produit commandé

          example: 665c8f123456789012345678

        quantity:
          type: integer

          minimum: 1

          example: 2

        totalPrice:
          type: number

          format: float

          example: 17.80



    OrderUpdateInput:

      type: object

      required:
        - productId
        - quantity
        - totalPrice
        - status

      properties:

        productId:
          type: string
          example: 665c8f123456789012345678

        quantity:
          type: integer
          minimum: 1
          example: 2

        totalPrice:
          type: number
          format: float
          example: 17.80

        status:
          type: string

          enum:
            - en_attente
            - en_preparation
            - prete
            - terminee
            - annulee

          example: en_preparation